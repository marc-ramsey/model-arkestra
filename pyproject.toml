[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project.scripts]
arkestra-server = "model_arkestra.server:main"
arkestra-cli = "model_arkestra.cli:main"
arkestra-init = "model_arkestra.cli:cmd_init_wrapper"

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-m 'not slow and not e2e'"
norecursedirs = "vendor"
markers = [
    "slow: tests that download & start a real LLM (~5-10 min first run, fast after cache)",
    "e2e: backend runner end-to-end — starts a cached GGUF model, verifies inference, checks logs (no HF download)",
]

[project]
name = "model-arkestra"
version = "0.2.0"
description = "Async process-based LLM server manager."
requires-python = ">=3.11"
dependencies = [
    "llm-config-manager",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
proxy = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
langchain = ["langchain-core>=0.3"]
test = ["httpx", "pytest-asyncio"]

[tool.setuptools.package-data]
model_arkestra = ["templates/*.j2"]
