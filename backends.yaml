engines:
  default-engine: llama-cpp

  llama-cpp:

backends:
  vulkan-radv:
    engine: llama-cpp
    runner: process
    description: "Vulkan with RADV driver — works on AMD, NVIDIA, and Intel GPUs"
    source_ref: official-vulkan-radv
    args:
      ngl: 999
      hf: ${CHECKPOINT}
      ctx-size: ${ctx-size}
  rocm:
    engine: llama-cpp
    runner: process
    description: "ROCm — best for AMD iGPU and discrete GPUs"
    source_ref: rocm-gfx1151
    args:
      ngl: 999
      hf: ${CHECKPOINT}
      ctx-size: ${ctx-size}
  rocm-container:
    engine: llama-cpp
    description: "ROCm container — kyuz0 toolbox with bundled ROCm libs"
    source_ref: amd-toolbox-rocm
    entrypoint: /usr/local/bin/llama-server
    devices:
    - /dev/kfd
    - /dev/dri
    args:
      hf: ${CHECKPOINT}
      ngl: 999
  cuda:
    engine: llama-cpp
    runner: process
    description: "NVIDIA CUDA — for NVIDIA discrete GPUs"
    source_ref: official-cuda
    args:
      ngl: 999
      hf: ${CHECKPOINT}
      ctx-size: ${ctx-size}
  cpu:
    engine: llama-cpp
    runner: process
    description: "CPU-only mode — uses all available cores"
    source_ref: ggml-org-cpu
    args:
      threads: ${nproc}
      hf: ${CHECKPOINT}
sources:
  official-vulkan-radv:
    type: github-release
    repo: ggml-org/llama.cpp
    release_type: latest
    asset_pattern: llama-*-bin-*-vulkan-x64*
    sha256_asset: '*.sha256'
  rocm-gfx110X:
    type: github-release
    repo: lemonade-sdk/llamacpp-rocm
    release_type: latest
    asset_pattern: llama-*-ubuntu-rocm-gfx110X-x64.zip
  rocm-gfx1150:
    type: github-release
    repo: lemonade-sdk/llamacpp-rocm
    release_type: latest
    asset_pattern: llama-*-ubuntu-rocm-gfx1150-x64.zip
  rocm-gfx1151:
    type: github-release
    repo: lemonade-sdk/llamacpp-rocm
    release_type: latest
    asset_pattern: llama-*-ubuntu-rocm-gfx1151-x64.zip
  rocm-gfx120X:
    type: github-release
    repo: lemonade-sdk/llamacpp-rocm
    release_type: latest
    asset_pattern: llama-*-ubuntu-rocm-gfx120X-x64.zip
  rocm-gfx90a:
    type: github-release
    repo: lemonade-sdk/llamacpp-rocm
    release_type: latest
    asset_pattern: llama-*-ubuntu-rocm-gfx90a-x64.zip
  rocm-gfx103X:
    type: github-release
    repo: lemonade-sdk/llamacpp-rocm
    release_type: latest
    asset_pattern: llama-*-ubuntu-rocm-gfx103X-x64.zip
  amd-toolbox-rocm:
    type: oci-image
    repo: docker.io/kyuz0/amd-strix-halo-toolboxes
    release_type: rocm-7.14
  official-cuda:
    type: github-release
    repo: ggml-org/llama.cpp
    release_type: latest
    asset_pattern: llama-*-bin-*-cuda-x64*
    sha256_asset: '*.sha256'
  ggml-org-cpu:
    type: github-release
    repo: ggml-org/llama.cpp
    release_type: latest
    asset_pattern: llama-*-bin-*-static-x86_64*
    sha256_asset: ''
defaults:
  release_type: latest
  verify_checksum: true
  cache_ttl_hours: 24
