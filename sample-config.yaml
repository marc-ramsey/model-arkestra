models-start-port: 18000
model-ports: 32
warmup-time: 10
defaults:
  ctx-size: 16384
  jinja: true
  n-gpu-layers: 999
  no-mmap: true

env:
  ADMIN_KEY: whatever
  HF_HUB_CACHE: /home/lemonade/hub
  HF_HUB_CACHE: /home/lemonade/hub

engines:
  llama_cpp:
    binary_dir: /home/marc/local/llama.cpp/build/bin
    binary: llama-server
    args:
      ctx-size: 16384
      jinja: true
      n-gpu-layers: 999
      no-mmap: true
    capabilities:
      - chat
      - embed

backends:
  default: vulkan-radv
  rocm:
    engine: llama_cpp
    image: ark-llama:rocm
    container: Containerfile.rocm
    runner: podman
    args:
      flash-attn: "on"
      hf: ${CHECKPOINT}
      port: "${PORT}"
      ngl: 999
      no-mmap: true
      np: 1
      threads: ${NPROC}
    binary_dir: /home/marc/local/llama.cpp/build-rocm/bin
    devices:
    - /dev/kfd
    - /dev/dri/card1:rwm
    - /dev/dri/renderD128:rwm
    env_container:
      GGML_CUDA_ENABLE_UNIFIED_MEMORY: 'ON'
      ROCBLAS_USE_HIPBLASLT: '1'
  vulkan-radv:
    engine: llama_cpp
    image: ark-llama:vulkan-radv
    container: Containerfile.vulkan-radv
    runner: process
    args:
      flash-attn: "on"
      hf: ${CHECKPOINT}
      port: "${PORT}"
      ngl: 999
      no-mmap: true
      np: 1
      threads: ${NPROC}
    binary_dir: /home/marc/local/llama.cpp/build-vulkan-radv/bin
    devices:
    - /dev/kfd
    - /dev/dri/card1:rwm
    - /dev/dri/renderD128:rwm
    env_container:
      GGML_CUDA_ENABLE_UNIFIED_MEMORY: 'ON'
      ROCBLAS_USE_HIPBLASLT: '1'

runners:
  default: ProcessModelRunner

models:
  gemma-4-e2b:
    checkpoint: unsloth/gemma-4-E2B-it-GGUF:Q4_K_M
    args:
      temp: 0.7
      top-p: 0.95
  qwen3.5-4b:
    backend: rocm
    checkpoint: unsloth/Qwen3.5-4B-GGUF:Q4_K_M
    args:
      presence-penalty: 1.5
  voxtral-mini:
    checkpoint: unsloth/Voxtral-Mini-3B-2507-GGUF:Q4_K_M
    args:
      top-p: 0.95
