models-start-port: 18000
model-ports: 32
warmup-time: 10

env:
  ADMIN_KEY: whatever
  HF_HUB_CACHE: /home/lemonade/hub

backends:
  default: vulkan-radv
  rocm:
    runner: ProcessModelRunner
    source_ref: rocm-gfx1151
    args:
      hf: ${CHECKPOINT}
      port: "${PORT}"
      ngl: 999
      ctx-size: ${ctx-size}
  rocm-container:
    runner: podman
    source_ref: amd-toolbox-rocm
    entrypoint: /usr/local/bin/llama-server
    devices:
    - /dev/kfd
    - /dev/dri
    args:
      hf: ${CHECKPOINT}
      ngl: 999
  cuda:
    runner: ProcessModelRunner
    source_ref: official-cuda
    args:
      hf: ${CHECKPOINT}
      port: "${PORT}"
      ngl: 999
      ctx-size: ${ctx-size}
  vulkan-radv:
    runner: ProcessModelRunner
    source_ref: official-vulkan-radv
    args:
      hf: ${CHECKPOINT}
      port: "${PORT}"
      ngl: 999
      ctx-size: ${ctx-size}
  cpu:
    runner: ProcessModelRunner
    source_ref: ggml-org-cpu
    args:
      hf: ${CHECKPOINT}
      threads: ${NPROC}
      no-mmap: true

sources:
  official-vulkan-radv:
    type: github-release
    repo: ggml-org/llama.cpp
    release_type: latest
    asset_pattern: llama-*-bin-*-vulkan-x64*
  rocm-gfx1151:
    type: github-release
    repo: lemonade-sdk/llamacpp-rocm
    release_type: latest
    asset_pattern: llama-*-ubuntu-rocm-gfx1151-x64.zip
  amd-toolbox-rocm:
    type: oci-image
    repo: docker.io/kyuz0/amd-strix-halo-toolboxes
    release_type: rocm-7.14
  official-cuda:
    type: github-release
    repo: ai-dock/llama.cpp-cuda
    release_type: latest
    asset_pattern: llama.cpp-*-cuda-*-amd64.tar.gz
  ggml-org-cpu:
    type: github-release
    repo: ggml-org/llama.cpp
    release_type: latest
    asset_pattern: llama-*-bin-*-static-x86_64*

models:
  gemma-4-e2b:
    checkpoint: unsloth/gemma-4-E2B-it-qat-GGUF:UD-Q4_K_XL
    backend: vulkan-radv
    args:
      temp: 0.7
      top-p: 0.95
      ctx-size: 2048
  qwen3.5-4b:
    checkpoint: unsloth/Qwen3.5-4B-GGUF:Q4_K_M
    backend: rocm
    args:
      temp: 0.7
      top-p: 0.95
      ctx-size: 2048
