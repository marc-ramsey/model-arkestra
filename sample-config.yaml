# ModelArkestra configuration — reference schema

default:
  model-start-port: 18000     # first port in the allocated range
  model-ports: 32              # number of ports available
  warmup-time: 10              # seconds to wait after model start
  app-log-lines: 2000          # size of the global log ring buffer
  model-repo: unsloth           # default HuggingFace repo owner
  model-quant: Q4_K_M          # default quantizer suffix

env:
  ADMIN_KEY: whatever
  HF_HUB_CACHE: ~/.cache/huggingface

backends:
  default: vulkan-radv
  rocm:
    runner: process
    source_ref: rocm-gfx1151
    container: Containerfile.rocm
    args:
      ngl: 999
      ctx-size: ${ctx-size}
  rocm-container:
    runner: podman
    source_ref: amd-toolbox-rocm
    entrypoint: /usr/local/bin/llama-server
    devices:
    - /dev/kfd
    - /dev/dri
    args:
      ngl: 999
  cuda:
    runner: process
    source_ref: official-cuda
    args:
      ngl: 999
      ctx-size: ${ctx-size}
  vulkan-radv:
    runner: process
    source_ref: official-vulkan-radv
    args:
      ngl: 999
      ctx-size: ${ctx-size}
  cpu:
    runner: process
    source_ref: ggml-org-cpu
    args:
      threads: ${NPROC}
      no-mmap: true

sources:
  official-vulkan-radv:
    type: github-release
    repo: ggml-org/llama.cpp
    release_type: latest
    asset_pattern: llama-*-bin-*-vulkan-x64*
  rocm-gfx1151:
    type: github-release
    repo: lemonade-sdk/llamacpp-rocm
    release_type: latest
    asset_pattern: llama-*-ubuntu-rocm-gfx1151-x64.zip
  amd-toolbox-rocm:
    type: oci-image
    repo: docker.io/kyuz0/amd-strix-halo-toolboxes
    release_type: rocm-7.14
  official-cuda:
    type: github-release
    repo: ai-dock/llama.cpp-cuda
    release_type: latest
    asset_pattern: llama.cpp-*-cuda-*-amd64.tar.gz
  ggml-org-cpu:
    type: github-release
    repo: ggml-org/llama.cpp
    release_type: latest
    asset_pattern: llama-*-bin-*-static-x86_64*

models:
  gemma-4-e2b:
    model: unsloth/gemma-4-E2B-it-qat-GGUF:UD-Q4_K_XL
    backend: vulkan-radv
    temp: 0.7
    top-p: 0.95
    ctx-size: 2048
  qwen3.5-4b:
    model: bartowski/Llama-3.2-1B-Instruct-GGUF:Q4_K_M
    backend: rocm
    temp: 0.7
    top-p: 0.95
    ctx-size: 2048
