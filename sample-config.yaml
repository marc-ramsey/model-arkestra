# ── Model Arkestra sample configuration ───────────────────────
# Copy this file to `config.yaml` and customize for your system.
# All paths can be overridden via environment variables.
#
# Environment variables used:
#   LLAMA_CACHE            — llama.cpp model cache  (default: ~/.cache/llama.cpp)
#   HF_HUB_CACHE           — HuggingFace Hub cache  (default: ~/.cache/huggingface/hub)
#   LLAMA_CPP_BUILD_DIR    — llama.cpp build dir     (default: /usr/local/llama.cpp/build-vulkan-radv/bin)
#   DOCKER_SOCKET          — Docker socket path       (default: /var/run/docker.sock)

models-start-port: 18000
model-ports: 32

env:
  LLAMA_CACHE: "${LLAMA_CACHE:-~/.cache/llama.cpp}"
  HF_HUB_CACHE: "${HF_HUB_CACHE:-~/.cache/huggingface/hub}"

macros:
  ctx-size: 16384

# ── Backend registry ───────────────────────────────────────────────
backends:
  default: vulkan-radv

  # ── Vulkan (process runner) ────────────────────────────────────
  vulkan-radv:
    binary_dir: "${LLAMA_CPP_BUILD_DIR:-/usr/local/llama.cpp/build-vulkan-radv/bin}"
    image: llama-strix-halo:vulkan
    env_container:
      ROCBLAS_USE_HIPBLASLT: "1"
      GGML_CUDA_ENABLE_UNIFIED_MEMORY: "ON"
    args: -hf ${CHECKPOINT} --port ${PORT}
    runner: process

  # ── ROCm (Podman/Docker container runner) ──────────────────────
  rocm:
    binary_dir: "${LLAMA_CPP_ROCM_BUILD_DIR:-/usr/local/llama.cpp/build-rocm/bin}"
    image: llama-strix-halo:rocm
    devices:
      - "/dev/dri/card1:rwm"
      - "/dev/dri/renderD128:rwm"
    env_container:
      ROCBLAS_USE_HIPBLASLT: "1"
      GGML_CUDA_ENABLE_UNIFIED_MEMORY: "ON"
    args: -hf ${CHECKPOINT} --port ${PORT}
    runner: podman

# ── Runner registry ────────────────────────────────────────────────
runners:
  default: ProcessModelRunner

# ── Models ─────────────────────────────────────────────────────────
models:
  qwen3.5-4b:
    checkpoint: unsloth/Qwen3.5-4B-GGUF:Q4_K_M
    args: --temp 1.0 --top-p 0.95 --presence-penalty 1.5 --ctx-size ${ctx-size} --jinja

  gemma-4-e2b:
    checkpoint: unsloth/gemma-4-E2B-it-GGUF:Q4_K_M
    args: --temp 0.7 --top-p 0.95 --ctx-size ${ctx-size} --jinja
