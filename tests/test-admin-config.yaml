default:
  model-start-port: 18000
  model-ports: 32
  default-image: ark-llama:vulkan-radv
  ctx-size: 16384

env:
  ADMIN_KEY: test-admin-key

backends:
  default: vulkan-radv
  rocm:
    args:
      flash-attn: 'on'
      port: ${PORT}
    binary_dir: /home/marc/local/llama.cpp/build-rocm/bin
    container: Containerfile.rocm
    devices:
    - /dev/kfd
    - /dev/dri/card1:rwm
    - /dev/dri/renderD128:rwm
    env_container:
      GGML_CUDA_ENABLE_UNIFIED_MEMORY: 'ON'
      ROCBLAS_USE_HIPBLASLT: '1'
    image: ark-llama:rocm
    runner: podman
  vulkan-radv:
    args:
      flash-attn: 'on'
      port: ${PORT}
    binary_dir: /home/marc/local/llama.cpp/build-vulkan-radv/bin
    container: Containerfile.vulkan-radv
    devices:
    - /dev/kfd
    - /dev/dri/card1:rwm
    - /dev/dri/renderD128:rwm
    env_container:
      GGML_CUDA_ENABLE_UNIFIED_MEMORY: 'ON'
      ROCBLAS_USE_HIPBLASLT: '1'
    image: ark-llama:vulkan-radv
    runner: process

models:
  gemma-4-e2b:
    model: unsloth/gemma-4-E2B-it-GGUF:Q4_K_M
  qwen3.5-4b:
    model: unsloth/Qwen3.5-4B-GGUF:Q4_K_M
    args:
      temp: 0.8
      top-k: 20
  voxtral-mini:
    model: unsloth/Voxtral-Mini-3B-2507-GGUF:Q4_K_M
