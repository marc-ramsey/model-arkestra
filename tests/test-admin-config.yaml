# Test config — mirrors sample-config.yaml structure

default:
  model-start-port: 18000
  model-ports: 32
  ctx-size: 16384

env:
  ADMIN_KEY: test-admin-key

backends:
  default: vulkan-radv
  rocm:
    runner: podman
    container: Containerfile.rocm
    image: ark-llama:rocm
  vulkan-radv:
    runner: podman
    container: Containerfile.vulkan-radv
    image: ark-llama:vulkan-radv

models:
  gemma-4-e2b:
    model: unsloth/gemma-4-E2B-it-GGUF:Q4_K_M
    backend: vulkan-radv
    temp: 0.7
    ctx-size: 16384
  qwen3.5-4b:
    model: unsloth/Qwen3.5-4B-GGUF:Q4_K_M
    backend: vulkan-radv
    temp: 0.8
    ctx-size: 16384
  voxtral-mini:
    model: unsloth/Voxtral-Mini-3B-2507-GGUF:Q4_K_M
    backend: vulkan-radv
