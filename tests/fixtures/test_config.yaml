# Minimal config for model-arkestra unit/slow tests.
# Not intended for real inference — just enough structure for code paths.

macros:
  llama-cmd: /usr/bin/llama-vulkan.sh --port ${PORT} -ngl 999
  reasoning-off: --temp 1.0 --top-k 64
  ctx-size: 4096
models-start-port: 18000

backends:
  default: process
  process:
    wrapper: /usr/bin/llama-vulkan.sh
    runner: process

models:
  test-model:
    cmd: |
      ${llama-cmd} ${reasoning-off} --ctx ${ctx-size}
