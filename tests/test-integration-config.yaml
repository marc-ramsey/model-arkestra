default:
  model-start-port: 18000
  model-ports: 2
  warmup-time: 10
  model-repo: unsloth
  model-quant: Q4_K_M
  ctx-size: 16384

env:
  ADMIN_KEY: test-admin-key

images:
  vulkan-radv:
    image: ark-llama:vulkan-radv
    containerfile: Containerfile.vulkan-radv

backends:
  default: vulkan-radv
  vulkan-radv:
    binary_dir: /home/marc/local/llama.cpp/build-vulkan-radv/bin
    binary: llama-server
    image: ark-llama:vulkan-radv
    env_container:
      ROCBLAS_USE_HIPBLASLT: '1'
      GGML_CUDA_ENABLE_UNIFIED_MEMORY: 'ON'
    args:
      hf: ${CHECKPOINT}
      port: ${PORT}
    runner: process

runners:
  default: process

models:
  qwen3.5-4b:
    repo: hugging-face
    model: unsloth/Qwen3.5-4B-GGUF:Q4_K_M
    args:
      temp: 1.0
      top-p: 0.95
      presence-penalty: 1.5
      ctx-size: ${ctx-size}
      jinja: true
  gemma-4-e2b:
    repo: hugging-face
    model: unsloth/gemma-4-E2B-it-GGUF:Q4_K_M
    args:
      temp: 0.7
      top-p: 0.95
      ctx-size: ${ctx-size}
      jinja: true
  voxtral-mini:
    repo: hugging-face
    model: unsloth/Voxtral-Mini-3B-2507-GGUF:Q4_K_M
    args:
      temp: 0.7
      top-p: 0.95
      ctx-size: ${ctx-size}
