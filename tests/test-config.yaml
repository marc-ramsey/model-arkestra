# ── Test configuration ────────────────────────────────────────────
# Uses ${VAR} macros — values defined in the `macros:` section.

warmup-time: 10
models-start-port: 18000
model-ports: 2

images:
  vulkan-radv:
    image: ark-llama:vulkan-radv
    containerfile: Containerfile.vulkan-radv
    default: true

default-image: ark-llama:vulkan-radv

macros:
  vulkan-build-dir: /home/marc/local/llama.cpp/build-vulkan-radv/bin
  ctx-size: 16384

backends:
  default: vulkan-radv
  vulkan-radv:
    binary_dir: /home/marc/local/llama.cpp/build-vulkan-radv/bin
    binary: llama-server
    image: ark-llama:vulkan-radv
    env_container:
      ROCBLAS_USE_HIPBLASLT: "1"
      GGML_CUDA_ENABLE_UNIFIED_MEMORY: "ON"
    args:
      flash-attn: "on"
      hf: ${CHECKPOINT}
      port: "${PORT}"
      ngl: 999
      no-mmap: true
      np: 1
      threads: ${NPROC}
    runner: process

runners:
  default: ProcessModelRunner

models:
  qwen3.5-4b:
    checkpoint: unsloth/Qwen3.5-4B-GGUF:Q4_K_M
    args:
      temp: 1.0
      top-p: 0.95
      presence-penalty: 1.5
      ctx-size: ${ctx-size}
      jinja: on

  gemma-4-e2b:
    checkpoint: unsloth/gemma-4-E2B-it-GGUF:Q4_K_M
    args:
      temp: 0.7
      top-p: 0.95
      ctx-size: ${ctx-size}
      jinja: on

  voxtral-mini:
    checkpoint: unsloth/Voxtral-Mini-3B-2507-GGUF:Q4_K_M
    args:
      temp: 0.7
      top-p: 0.95
      ctx-size: ${ctx-size}
