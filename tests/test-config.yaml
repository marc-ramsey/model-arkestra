# ── Model Arkestra configuration — 3 models ───────────────────────────
# Qwen3.5-4B     (text + image → text, multimodal LLM)
# Gemma-4 E2B-it (text + image + audio → text, omni LLM)
# Voxtral-Mini   (text + audio → text, speech ASR & understanding)

backend-registry: /home/marc/local/model-arkestra/backends

models-start-port: 18000
model-ports: 2

env:
  LLAMA_CACHE: /home/lemonade/hub
  HF_HUB_CACHE: /home/lemonade/hub

macros:
  ctx-size: 16384

backends:
  default: vulkan-radv               # global default backend ID
  vulkan-radv:
    binary_dir: /home/marc/local/llama.cpp/build-vulkan-radv/bin
    image: llama-vulkan-driver:vulkan
    env_container:
      ROCBLAS_USE_HIPBLASLT: "1"
      GGML_CUDA_ENABLE_UNIFIED_MEMORY: "ON"
    args: -hf ${CHECKPOINT} --port ${PORT}
    runner: process
  podman-vulkan:
    args: -hf ${CHECKPOINT} --port ${PORT}
    image: llama-vulkan-driver:vulkan

runners:
  default: ProcessModelRunner

models:
  # ── Qwen3.5-4B (text + image → text, multimodal) ──────────────────
  qwen3.5-4b:
    checkpoint: unsloth/Qwen3.5-4B-GGUF:Q4_K_M
    args: --temp 1.0 --top-p 0.95 --presence-penalty 1.5 --ctx-size ${ctx-size} --jinja

  # ── Gemma-4 E2B-it (text + image + audio → text, omni LLM) ────────
  gemma-4-e2b:
    checkpoint: unsloth/gemma-4-E2B-it-GGUF:Q4_K_M
    args: --temp 0.7 --top-p 0.95 --ctx-size ${ctx-size} --jinja

  # ── Voxtral-Mini-3B (text + audio → text, speech ASR & understanding)
  voxtral-mini:
    checkpoint: unsloth/Voxtral-Mini-3B-2507-GGUF:Q4_K_M
    args: --temp 0.7 --top-p 0.95 --ctx-size ${ctx-size}
