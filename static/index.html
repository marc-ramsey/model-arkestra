<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArkestraAdmin</title>
    <link rel="stylesheet" href="data:text/css,">

    <style>
        /* ── Reset & Custom Properties ─────────────────────────────── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:             #f5f3f0;
            --surface:        #ffffff;
            --surface-alt:    #faf9f7;
            --border:         #e2dfd8;
            --text:           #3a3632;
            --text-dim:       #8a8580;
            --accent:         #7b9cb5;
            --accent-hover:   #6a8da6;
            --accent-light:   #e8f1f7;
            --green:          #7ab89c;
            --green-bg:       #e4f3ea;
            --amber:          #d4a053;
            --amber-bg:       #fdf3e6;
            --red:            #c96b6b;
            --red-bg:         #fceaeaea;
            --radius:         8px;
            --radius-sm:      5px;
            --padding:        6px;
            --font:           -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --col-width:      40%;
        }

        html { font-size: 13px; }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* ── Header Bar ────────────────────────────────────────────── */
        .header-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px var(--padding);
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            font-size: 15px;
            font-weight: 600;
            letter-spacing: -0.3px;
            user-select: none;
            flex-shrink: 0;
        }
        .header-bar .title { display: flex; align-items: center; gap: 8px; }
        .header-bar .model-count {
            font-size: 12px;
            font-weight: 400;
            color: var(--text-dim);
        }

        /* ── Layout ────────────────────────────────────────────────── */
        .layout {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        .left-panel {
            width: var(--col-width);
            min-width: 250px;
            max-width: 80%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .right-panel {
            flex: 1;
            min-width: 300px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .pane {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-height: 0;
        }
        .pane-logs { flex: 1; min-height: 0; }
        .pane-chat { flex: 1; min-height: 0; }

        .pane-header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 8px;
            background: var(--surface-alt);
            border-bottom: 1px solid var(--border);
            font-size: 11px;
            flex-shrink: 0;
        }
        .pane-header label { white-space: nowrap; display: flex; align-items: center; gap: 4px; cursor: pointer; }
        .pane-header select {
            padding: 3px 6px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 11px;
            font-family: var(--font);
            background: var(--surface);
            color: var(--text);
            outline: none;
        }
        .pane-header select:focus { border-color: var(--accent); }

        .divider-v, .divider {
            width: 5px;
            cursor: col-resize;
            background: var(--border);
            transition: background 0.15s;
            flex-shrink: 0;
            position: relative;
        }
        .divider-v:hover, .divider-v.active, .divider:hover, .divider.active {
            background: var(--accent);
        }

        .divider-h {
            height: 5px;
            cursor: row-resize;
            background: var(--border);
            transition: background 0.15s;
            flex-shrink: 0;
        }
        .divider-h:hover, .divider-h.active {
            background: var(--accent);
        }

        /* ── Accordion (shared) ────────────────────────────────────── */
        .accordion, .accordion-item {
            flex-shrink: 0;
            border-bottom: 1px solid var(--border);
            background: var(--surface);
            overflow: hidden;
        }
        .accordion:last-child,
        .col-right > .accordion-item:last-child {
            flex: 1;
            min-height: 0;
            border-bottom: none;
        }

        .accordion h3, .accordion-item h3 {
            padding: var(--padding) 8px;
            font-size: 12.5px;
            font-weight: 600;
            color: var(--text);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            user-select: none;
            background: var(--surface-alt);
            border-bottom: 1px solid var(--border);
        }
        .accordion h3:hover, .accordion-item h3:hover {
            background: var(--accent-light);
            color: var(--accent-hover);
        }

        .accordion h3::after, .accordion-item h3::after {
            content: '';
            display: inline-block;
            width: 6px; height: 6px;
            border-right: 1.5px solid currentColor;
            border-bottom: 1.5px solid currentColor;
            transform: rotate(-45deg);
            transition: transform 0.2s;
            flex-shrink: 0;
        }
        .accordion.collapsed h3::after,
        .accordion-item.collapsed h3::after {
            transform: rotate(45deg);
        }

        .accordion-body, .accordion-item .acc-body {
            padding: var(--padding) 8px;
            overflow-y: auto;
            display: block;
        }
        .accordion.collapsed > .accordion-body,
        .accordion-item.collapsed > .acc-body {
            display: none;
        }

        /* ── Right column accordion — panes split height ───────────── */
        /* ── Model List ─────────────────────────────────────────────── */
        #model-search {
            width: 100%;
            padding: 5px 8px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-family: var(--font);
            background: var(--surface-alt);
            outline: none;
        }
        #model-search:focus { border-color: var(--accent); }

        #model-list {
            list-style: none;
            margin-top: 6px;
            max-height: calc(100vh * 0.45);
            overflow-y: auto;
        }
        .model-item {
            display: flex;
            align-items: center;
            padding: 5px 6px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 12.5px;
            transition: background 0.1s;
        }
        .model-item:hover { background: var(--surface-alt); }
        .model-item.selected { background: var(--accent-light); }

        .status-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            margin-right: 7px;
            flex-shrink: 0;
            background: var(--green);
        }
        .status-dot.running  { background: #4aad7d; }
        .status-dot.stopped  { background: #2e5a42; }       /* cached but not running — ~20% dimmer */
        .status-dot.loading, .status-dot.stopping { background: var(--amber); animation: pulse 1.2s infinite; }
        .status-dot.error    { background: var(--red); }
        .status-dot.uncached { background: #8a8580; }       /* no files — gray */

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .model-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .model-meta { font-size: 10.5px; color: var(--text-dim); margin-left: 6px; flex-shrink: 0; }

        /* ── Edit Form ─────────────────────────────────────────────── */
        .edit-form-grid {
            display: grid;
            gap: 8px;
        }
        .edit-field label {
            display: block;
            font-size: 10.5px;
            font-weight: 600;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.4px;
            margin-bottom: 3px;
        }
        .edit-field input[type="text"],
        .edit-field select,
        .edit-field textarea {
            width: 100%;
            padding: 5px 8px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-family: var(--font);
            background: var(--surface-alt);
            color: var(--text);
            outline: none;
        }
        .edit-field input:focus,
        .edit-field select:focus,
        .edit-field textarea:focus {
            border-color: var(--accent);
        }
        .edit-field textarea { resize: vertical; min-height: 50px; max-height: 120px; }

        .capabilities-list {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }
        .capability-chip {
            padding: 3px 8px;
            border-radius: 99px;
            font-size: 11px;
            background: var(--surface-alt);
            border: 1px solid var(--border);
            cursor: pointer;
            transition: all 0.15s;
        }
        .capability-chip.active {
            background: var(--accent-light);
            border-color: var(--accent);
            color: var(--accent-hover);
        }

        .form-actions {
            display: flex;
            gap: 4px;
            margin-top: 6px;
            padding-top: 8px;
            border-top: 1px solid var(--border);
        }
        .form-actions button {
            flex: 1;
            padding: 5px 0;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 11.5px;
            font-family: var(--font);
            background: var(--surface-alt);
            color: var(--text);
            cursor: pointer;
            transition: all 0.15s;
        }
        .form-actions button:hover:not(:disabled) {
            border-color: var(--accent);
            background: var(--accent-light);
        }
        .form-actions button:disabled {
            opacity: 0.4;
            cursor: default;
        }
        .form-actions #btn-start {
            background: var(--green-bg);
            border-color: var(--green);
            color: #3d7a55;
        }

        /* ── Logs Display ──────────────────────────────────────────── */
        .log-container {
            font-family: "SF Mono", "Cascadia Code", "Fira Code", Consolas, monospace;
            font-size: 11px;
            line-height: 1.5;
            background: #1e1e24;
            color: #c8c5be;
            padding: var(--padding) 10px;
            border-radius: var(--radius);
            max-height: calc(100vh * 0.35);
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .log-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
            font-size: 11px;
        }
        .log-controls label { cursor: pointer; display: flex; align-items: center; gap: 4px; }

        /* ── Chat ──────────────────────────────────────────────────── */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding-bottom: var(--padding);
            min-height: 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .chat-msg {
            padding: var(--padding) 10px;
            border-radius: var(--radius);
            max-width: 92%;
            font-size: 12.5px;
            line-height: 1.45;
        }
        .chat-msg.user {
            align-self: flex-end;
            background: var(--accent);
            color: #fff;
            border-bottom-right-radius: 2px;
        }
        .chat-msg.assistant {
            align-self: flex-start;
            background: var(--surface-alt);
            border: 1px solid var(--border);
            border-bottom-left-radius: 2px;
        }
        .chat-msg.error {
            align-self: center;
            background: var(--red-bg);
            color: var(--red);
            font-size: 11.5px;
        }

        .chat-form {
            display: flex;
            gap: 4px;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid var(--border);
        }
        .chat-form textarea {
            flex: 1;
            padding: 6px 8px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-family: var(--font);
            resize: none;
            height: 36px;
            outline: none;
        }
        .chat-form textarea:focus { border-color: var(--accent); }

        .chat-send-btn {
            padding: 0 12px;
            border: none;
            border-radius: var(--radius-sm);
            background: var(--accent);
            color: #fff;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.15s;
        }
        .chat-send-btn:hover { background: var(--accent-hover); }
        .chat-send-btn:disabled { opacity: 0.4; cursor: default; }

        /* Chat params panel (slide-out above input) */
        .chat-params-toggle {
            font-size: 11px;
            color: var(--text-dim);
            cursor: pointer;
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 3px;
        }
        .chat-params-panel {
            display: none;
            background: var(--surface-alt);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 6px 8px;
            margin-top: 4px;
        }
        .chat-params-panel.open { display: block; }
        .chat-params-grid {
            display: grid;
            grid-template-columns: repeat(3, auto);
            gap: 6px 12px;
            align-items: center;
        }
        .chat-param label {
            font-size: 10.5px;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .chat-param input[type="number"] {
            width: 60px;
            padding: 3px 6px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-family: var(--font);
        }

        /* ── Chat messages ───────────────────────────────────── */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-height: 0;
        }
        .message {
            max-width: 90%;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 0.85rem;
            line-height: 1.4;
            word-wrap: break-word;
        }
        .message.user {
            align-self: flex-end;
            background: var(--accent-light);
            color: var(--text-dark);
        }
        .message.assistant {
            align-self: flex-start;
            background: var(--bg-tertiary);
            color: var(--text);
        }
        .message.streaming .cursor {
            display: inline-block;
            width: 2px;
            height: 1em;
            background: currentColor;
            margin-left: 2px;
            animation: blink 0.6s infinite;
            vertical-align: text-bottom;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* ── Scrollbars (subtle) ───────────────────────────────────── */
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }

        /* ── Left panel — accordion scroll ───────────────────────── */
        .left-panel .accordion {
            flex-shrink: 0;
            overflow: hidden;
        }
        .left-panel .accordion.collapsed > .accordion-body { display: none; }
        #model-accordion-items {
            /* Fills remaining height of accordion, scrolls if needed */
            max-height: calc(100vh - 60px);
            overflow-y: auto;
            flex-shrink: 1;
        }

        /* ── Model config panel (inside expanded model row) ─────────── */
        .model-config-panel {
            padding: 6px 8px;
            max-height: calc(100vh * 0.4);
            overflow-y: auto;
        }
        .model-actions {
            display: flex;
            gap: 4px;
            margin-top: 8px;
            padding-top: 6px;
            border-top: 1px solid var(--border);
        }
        .model-actions button {
            width: 32px;
            height: 26px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--surface-alt);
            color: var(--text);
            font-size: 14px;
            cursor: pointer;
            position: relative;
            transition: all 0.15s;
        }
        .model-actions button:hover:not(:disabled) {
            border-color: var(--accent);
            background: var(--accent-light);
        }
        .model-actions button:disabled {
            opacity: 0.35;
            cursor: default;
        }
        .model-actions button.btn-danger { color: var(--red); }
        .model-actions button.btn-danger:hover:not(:disabled) {
            background: var(--red-bg);
            border-color: var(--red);
        }
        .model-actions button.btn-success {
            background: var(--green-bg);
            border-color: var(--green);
            color: #3d7a55;
        }
        /* Hover tooltip via title attr */
        .model-actions button::after {
            content: attr(title);
            position: absolute;
            bottom: calc(100% + 4px);
            left: 50%;
            transform: translateX(-50%);
            padding: 3px 6px;
            background: var(--text);
            color: var(--bg);
            font-size: 10px;
            border-radius: 3px;
            white-space: nowrap;
            z-index: 10;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.15s;
        }
        .model-actions button:hover::after {
            opacity: 1;
        }

        /* ── Markdown in chat ──────────────────────────────────────── */
        .chat-msg assistant p { margin: 0.4em 0; }
        .chat-msg assistant code, .message code, .markdown-body code {
            background: rgba(0,0,0,0.06);
            padding: 1px 5px;
            border-radius: 3px;
            font-size: 0.9em;
            font-family: "SF Mono", "Cascadia Code", Consolas, monospace;
        }
        .chat-msg assistant pre, .message pre, .markdown-body pre {
            background: rgba(0,0,0,0.06);
            padding: var(--padding) 10px;
            border-radius: var(--radius-sm);
            overflow-x: auto;
            margin: 0.4em 0;
        }
        .chat-msg assistant pre code, .message pre code, .markdown-body pre code { background: none; padding: 0; }

        /* ── Loading placeholder ───────────────────────────────────── */
        .placeholder-text {
            color: var(--text-dim);
            font-size: 12px;
            text-align: center;
            padding: 16px 8px;
            font-style: italic;
        }
    </style>

    <script>
        // ── 1.0 Configuration ─────────────────────────────────────
        const ADMIN_KEY = '{{ADMIN_KEY}}';
        const BASE_URL  = '';

        // ── 1.2 Global State ──────────────────────────────────────
        let modelsCache      = [];          // from GET /admin/models
        let modelStates      = {};          // { modelName: { config, snapshot, dirty, expanded } }
        let logModel         = '';          // currently selected model for logs pane
        let chatModel        = '';          // currently selected model for chat pane
        let backendOptions   = {};           // backends dict from /admin/models response
        let runnerTypes      = [];          // runner types from /admin/models response

        // Drag state for resize handles
        let isVDragging  = false;           // vertical (left/right) divider
        let isHDragging  = false;           // horizontal (logs/chat) divider

        // Log streaming state
        let logStreamCtrl    = null;        // AbortController for SSE log stream
        let currentLogLines  = [];          // accumulated log lines
        let isChatStreaming  = false;       // true while a chat response is streaming

        // ── 1.3 Fetch Helpers ─────────────────────────────────────
        function adminFetch(path, options = {}) {
            const headers = { 'X-Admin-Key': ADMIN_KEY, ...options.headers };
            const opts = { method: 'GET', headers, ...options };
            // Remove Content-Type for GET (browser handles it)
            if (opts.method === 'GET') delete opts.headers['Content-Type'];

            return fetch(`${BASE_URL}${path}`, opts).then(async r => {
                const body = await r.text();
                if (!r.ok) {
                    let detail;
                    try { detail = JSON.parse(body).detail || body; }
                    catch { detail = body; }
                    throw new Error(`[admin ${r.status}] ${detail}`);
                }
                return body ? JSON.parse(body) : null;
            });
        }

        function adminGet(path, params) {
            const qs = params ? '?' + new URLSearchParams(params).toString() : '';
            return adminFetch(path + qs);
        }

        function adminPost(path, body) {
            return adminFetch(path, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body),
            });
        }

        function adminPut(path, body) {
            return adminFetch(path, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body),
            });
        }

        // ── 4. Model List — fetch + render accordion items ───────────────
        function updateModelCount() {
            const badge = document.getElementById('model-count');
            if (badge) badge.textContent = '(' + modelsCache.length + ' models)';
        }

        function buildAccordionItems() {
            const container = document.getElementById('model-accordion-items');
            if (!container) return;

            // Build HTML for each model as an accordion item
            let html = '';
            for (const m of modelsCache) {
                const name = m.id;
                const statusClass = m.status ? m.status.replace('runnerstate.', '').toLowerCase() : 'uncached';
                const stateKey = 'sec-model-' + name.replace(/[^a-zA-Z0-9_-]/g, '_');
                html += '<section class="accordion-item" id="' + stateKey + '">'
                    + '  <h3 data-model="' + name + '" onclick="toggleAccordion('' + stateKey + '')">'
                    + '    <span class="status-dot ' + statusClass + '"></span>'
                    + '    <span class="model-name" title="' + name + '">' + name + '</span>'
                    + '  </h3>'
                    + '  <div class="acc-body">'
                    + '    <div class="model-config-panel" id="body-' + name.replace(/[^a-zA-Z0-9_-]/g, '_') + '">'
                    + '      <!-- Config fields populated on expand -->'
                    + '      <p class="placeholder-text">Click to load configuration…</p>'
                    + '    </div>'
                    + '  </div>'
                    + '</section>';
            }
            container.innerHTML = html;
        }

        async function refreshModels() {
            try {
                // Fetch both models status and config list
                const [statusData, configData] = await Promise.all([
                    adminGet('/admin/models'),
                    adminGet('/admin/config'),
                ]);

                if (statusData && Array.isArray(statusData.models)) {
                    modelsCache = statusData.models;
                    backendOptions = statusData.backends || {};
                    runnerTypes = statusData.runner_types || [];
                } else if (!modelsCache.length) {
                    // Fallback: just names from config
                    updateModelCount();
                    buildAccordionItems();
                    return;
                }

                updateModelCount();
                buildAccordionItems();

                // Populate right-column dropdowns
                populateRightDropdowns();

            } catch (e) {
                console.error('[admin] failed to refresh models:', e.message);
                const badge = document.getElementById('model-count');
                if (badge) badge.textContent = '(!error)';
            }
        }

        function populateRightDropdowns() {
            for (const id of ['log-model-select', 'chat-model-select']) {
                const sel = document.getElementById(id);
                if (!sel) continue;
                let html = '<option value="">— none —</option>';
                for (const m of modelsCache) {
                    html += '<option value="' + m.id + '">' + m.id + '</option>';
                }
                sel.innerHTML = html;
            }
        }

        // ── 5. Per-model config panel on expand ─────────────────────
        async function populateModelPanel(modelName) {
            const bodyId = 'body-' + modelName.replace(/[^a-zA-Z0-9_-]/g, '_');
            const panel = document.getElementById(bodyId);
            if (!panel) return;

            // Check if already populated (avoid re-fetch on collapse+re-expand)
            if (panel.dataset.fetched === '1') return;

            try {

                    for (const t of runnerTypes) {

                // Args textarea
                html += '<div class="edit-field"><label for="mc-args-' + modelName.replace(/[^a-zA-Z0-9_-]/g, '_') + '">Args</label>';

                    html += '  <span class="capability-chip' + (selectedCaps.has(c) ? ' active' : '') + '" data-cap="' + c + '">' + c + '</span>';
                }
                html += '</div></div>';

                // Log buffer size
                html += '<div class="edit-field"><label for="mc-log-buffer-' + modelName.replace(/[^a-zA-Z0-9_-]/g, '_') + '">Log Buffer Size</label>';

        // Dirty detection for a model panel
        function maybeUpdateDirty(modelName) {
            if (!modelStates[modelName]) return;
            const current = getModelFormValues(modelName);
            const caps = getModelCapabilities(modelName);
            const snap = modelStates[modelName].snapshot;
            const isDirty = (
                current.checkpoint !== snap.checkpoint ||
                (current.backend ?? '') !== (snap.backend ?? '') ||
                (current.runner ?? '') !== (snap.runner ?? '') ||
                current.args !== (snap.args ?? '') ||
                current.max_log_lines !== (snap.max_log_lines ?? 500) ||
                JSON.stringify(caps.sort()) !== JSON.stringify((snap.capabilities || ['chat']).sort())
            );
            modelStates[modelName].dirty = isDirty;
            const btn = document.getElementById('mc-save-' + modelName.replace(/[^a-zA-Z0-9_-]/g, '_'));
            if (btn) btn.disabled = !isDirty;
        }

            const div = document.createElement('div');

        function escapeAttr(str) {
            return (str || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        // ── 5. Logs pane functions ────────────────────────────────
        function stopLogFollow() {
            if (logStreamCtrl) {
                logStreamCtrl.abort();
                logStreamCtrl = null;
            }
            currentLogLines = [];
            // Also update the checkbox state to unchecked
            const checkEl = document.getElementById('log-follow-cb');
            if (checkEl) checkEl.checked = false;
        }

        async function loadLogSnapshot(modelName) {
            const display = document.getElementById('log-display');
            if (!display) return;
            display.textContent = '';
            currentLogLines = [];

            if (!modelName) {
                const ph = document.createElement('p');
                ph.className = 'placeholder-text';
                ph.textContent = 'Select a model to view logs.';
                display.appendChild(ph);
                return;
            }

            try {
                const data = await adminGet('/admin/log/' + encodeURIComponent(modelName), { lines: 200 });
                if (data && data.data) appendLogLines(data.data);
            } catch (e) {
                console.error('[admin] log snapshot failed for ' + modelName + ':', e.message);
            }
        }


        function appendLogLines(lines) {
            const display = document.getElementById('log-display');
            if (!display || !lines.length) return;

            // Check if user is near bottom before appending
            const nearBottom = display.scrollHeight - display.scrollTop <= display.clientHeight + 60;

            lines.forEach(line => {
                const div = document.createElement('div');
                div.className = 'log-line';
                div.textContent = line;
                display.appendChild(div);
            });

            currentLogLines.push(...lines);

            // Only auto-scroll if user was already at bottom
            if (nearBottom) display.scrollTop = display.scrollHeight;
        }


        async function startLogFollow(modelName) {
            stopLogFollow();                  // abort any prior stream
            logStreamCtrl = new AbortController();

            try {
                const resp = await fetch(`${BASE_URL}/admin/log/${modelName}?follow=true`, {
                    signal: logStreamCtrl.signal,
                });
                if (!resp.ok) throw new Error(`log stream ${resp.status}`);

                const reader = resp.body.getReader();
                const decoder = new TextDecoder();
                let buf = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buf += decoder.decode(value, { stream: true });
                    // Parse SSE frames
                    const frames = buf.split('\n\n');
                    buf = frames.pop();  // last partial frame stays in buffer

                    for (const frame of frames) {
                        if (!frame.startsWith('data: ')) continue;
                        try {
                            const msg = JSON.parse(frame.slice(6));
                            if (msg.type === 'snapshot') {
                                appendLogLines(msg.lines || []);
                            } else if (msg.type === 'line') {
                                appendLogLines(msg.lines || []);
                            }
                        } catch { /* skip malformed frames */ }
                    }
                }
            } catch (err) {
                if (err.name !== 'AbortError') console.error('[admin] log stream error:', err.message);
            }
        }

        // ── 6. Chat pane functions ────────────────────────────────
        let chatHistory      = [];   // full conversation history for selected model
        let chatAbortCtrl    = null; // AbortController for active chat stream
        const CHAT_PARAMS_KEY = 'arkestra-chat-params';

        // 6.1 Parameters panel toggle
        function toggleChatParams() {
            const panel = document.getElementById('right-chat-params-panel');
            const toggle = document.getElementById('right-chat-params-toggle');
            if (!panel || !toggle) return;
            panel.classList.toggle('open');
            const isOpen = panel.classList.contains('open');
            toggle.textContent = isOpen ? '⚙ Parameters ▴' : '⚙ Parameters ▾';
            requestAnimationFrame(() => layoutRightPanels());
        }

        // 6.2 Param persistence
        function getChatParams() {
            const stored = localStorage.getItem(CHAT_PARAMS_KEY);
            if (stored) {
                try { return JSON.parse(stored); } catch { return {}; }
            }
            return {};
        }

        function saveChatParams() {
            if (!chatModel) return;
            const params = getChatParams();
            params[chatModel] = {
                temperature: parseFloat(document.getElementById('rcp-temp')?.value) || 0.7,
                top_p: parseFloat(document.getElementById('rcp-top-p')?.value) || 0.95,
                max_tokens: parseInt(document.getElementById('rcp-max-tokens')?.value) || 512,
            };
            localStorage.setItem(CHAT_PARAMS_KEY, JSON.stringify(params));
        }

        function restoreChatParams() {
            if (!chatModel) return;
            const params = getChatParams()[chatModel];
            if (!params) return;
            document.getElementById('rcp-temp').value     = String(params.temperature ?? 0.7);
            document.getElementById('rcp-top-p').value     = String(params.top_p ?? 0.95);
            document.getElementById('rcp-max-tokens').value = String(params.max_tokens ?? 512);
        }

        // 6.3 Message bubble helpers
        function appendMessageBubble(role, content, isStreaming) {
            const container = document.getElementById('chat-display');
            if (!container) return;

            // Determine if we should auto-scroll: always for user messages,
            // only at bottom for assistant during streaming
            const nearBottom = container.scrollHeight - container.scrollTop <= container.clientHeight + 40;

            const div = document.createElement('div');
            div.className = `message ${role}${isStreaming ? ' streaming' : ''}`;

            if (role === 'user') {
                div.textContent = content;
                container.appendChild(div);
                container.scrollTop = container.scrollHeight;  // Always scroll for user
                return div;
            } else {
                div.innerHTML = isStreaming
                    ? content + '<span class="cursor"></span>'
                    : content;
                container.appendChild(div);
                if (nearBottom) container.scrollTop = container.scrollHeight;
                return div;
            }
        }

        // 6.3 Send message (form submit handler)
        async function sendMessage(e) {
            e.preventDefault();
            const input = document.getElementById('right-chat-input');
            if (!input || !chatModel || isChatStreaming) return;

            const userText = input.value.trim();
            if (!userText) return;

            // Append user message to UI and history
            appendMessageBubble('user', userText, false);
            chatHistory.push({ role: 'user', content: userText });
            input.value = '';

            // Create assistant bubble (streaming)
            const assitDiv = appendMessageBubble('assistant', '', true);
            let rawContent = '';

            isChatStreaming = true;
            document.getElementById('right-chat-send-btn').disabled = true;

            try {
                await streamChatResponse(chatHistory, chatModel, (delta) => {
                    rawContent += delta;
                    assitDiv.textContent = rawContent + ' ';  // cursor handled by CSS class
                    const container = document.getElementById('chat-display');
                    if (container) container.scrollTop = container.scrollHeight;
                });

                // Stream complete — render markdown
                isChatStreaming = false;
                assitDiv.classList.remove('streaming');
                assitDiv.textContent = '';  // clear plain text
                await renderMarkdown(assitDiv, rawContent);
            } catch (err) {
                if (err.name !== 'AbortError') {
                    console.error('[chat] stream failed:', err.message);
                    appendMessageBubble('assistant', `⚠ Error: ${err.message}`, false);
                }
                isChatStreaming = false;
            }

            document.getElementById('right-chat-send-btn').disabled = false;
        }

        // 6.4 Streaming response handler
        async function streamChatResponse(messages, modelName, onToken) {
            stopLogFollow();    // ensure no log stream conflict

            chatAbortCtrl = new AbortController();

            const modelInfo = modelsCache.find(m => m.id === modelName);
            if (!modelInfo || !modelInfo.port) {
                throw new Error('Model is not running or has no port');
            }

            const allParams = getChatParams();
            const mp = allParams[modelName] || { temperature: 0.7, top_p: 0.95, max_tokens: 512 };

            const payload = {
                model: modelName,
                messages: messages,
                stream: true,
                temperature: mp.temperature,
                top_p: mp.top_p,
                max_tokens: mp.max_tokens,
            };

            const port = modelInfo.port;
            const url = 'http://127.0.0.1:' + port + '/v1/chat/completions';

            const resp = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload),
                signal: chatAbortCtrl.signal,
            });

            if (!resp.ok) throw new Error(`Chat API ${resp.status}: ${await resp.text()}`);

            const reader = resp.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                buffer += decoder.decode(value, { stream: true });
                const lines = buffer.split('\n');
                buffer = lines.pop();  // partial line stays

                for (const line of lines) {
                    const trimmed = line.trim();
                    if (!trimmed) continue;

                    // Handle SSE format: "data: {...}" or "data: [DONE]"
                    let text = trimmed;
                    if (text.startsWith('data: ')) {
                        text = text.slice(6);
                    }

                    if (text === '[DONE]') return;

                    try {
                        const parsed = JSON.parse(text);
                        const delta = parsed.choices?.[0]?.delta?.content || '';
                        if (delta) onToken(delta);
                    } catch { /* skip malformed SSE lines */ }
                }
            }
        }

        // 6.5 Markdown rendering with marked.js fallback
        function renderMarkdown(element, text) {
            return new Promise((resolve) => {
                if (typeof marked !== 'undefined') {
                    element.innerHTML = marked.parse(text);
                    resolve();
                } else {
                    // marked is loaded with defer — wait for it
                    const maxWait = 50;
                    let attempts = 0;
                    const poll = () => {
                        if (typeof marked !== 'undefined') {
                            element.innerHTML = marked.parse(text);
                            resolve();
                        } else if (++attempts < maxWait) {
                            setTimeout(poll, 100);
                        } else {
                            // Fallback: plain text with basic formatting
                            element.textContent = text;
                            console.warn('[chat] marked.js not loaded — showing raw text');
                            resolve();
                        }
                    };
                    poll();
                }
            });
        }

        function clearChatHistory() {
            // Per-model chat history already stored in localStorage
            // Just clear the display when switching models
            const container = document.getElementById('chat-display');
            if (container) container.textContent = '';
            chatHistory = [];
        }

        // (stopChatStream - called implicitly on model change)
        function stopChatStream() {
            if (chatAbortCtrl) {
                chatAbortCtrl.abort();
                chatAbortCtrl = null;
            }
        }

        // ── Lifecycle ─────────────────────────────────────────────
        document.addEventListener('DOMContentLoaded', () => {
            refreshModels();

            // Search filter (2.2)
            const search = document.getElementById('model-search');
            if (search) search.addEventListener('input', e => {
                renderModelList(e.target.value);
            });

            // Model click delegation on the list
            const list = document.getElementById('model-list');
            if (list) list.addEventListener('click', e => {
                const item = e.target.closest('.model-item');
                if (!item || !item.dataset.model) return;
                selectModel(item.dataset.model);
            });

            // ── 3.5 Reset button ─────────────────────────────────────
            document.getElementById('btn-reset')?.addEventListener('click', resetEditForm);
            // ── 3.6 Save button (form submit) ────────────────────────
            document.getElementById('edit-form')?.addEventListener('submit', saveEditForm);
            // ── 3.7 Cancel button ────────────────────────────────────
            document.getElementById('btn-cancel')?.addEventListener('click', cancelEditForm);
            // ── 3.8 Start/Restart button ─────────────────────────────
            document.getElementById('btn-start')?.addEventListener('click', startSelectedModel);

            // ── 4.1 Accordion toggle (shared) ─────────────────────────
            window.toggleAccordion = function(id) {
                const el = document.getElementById(id);
                if (!el) return;
                const wasCollapsed = el.classList.contains('collapsed');
                el.classList.toggle('collapsed');

                requestAnimationFrame(() => layoutRightPanels());
            };

            // ── 4.2 Right-accordion height splitting ─────────────────
            function layoutRightPanels() {
                const accordion = document.getElementById('right-accordion');
                if (!accordion) return;
                const items = Array.from(accordion.querySelectorAll('.accordion-item'));
                // Count open items (not collapsed)
                const openItems = items.filter(i => !i.classList.contains('collapsed'));
                const closedCount = items.length - openItems.length;

                if (openItems.length === 0) {
                    accordion.style.height = '100%';
                    return;
                }

                // Each open pane gets equal share of the height minus collapsed panes
                // Collapse a single item takes ~32px (h3 area), so subtract that for each closed item
                const availableHeight = 100 - (closedCount * 0);
                items.forEach(item => {
                    if (item.classList.contains('collapsed')) {
                        item.style.flex = '0 0 auto';
                    } else {
                        item.style.flex = `1 1 ${Math.round(availableHeight / openItems.length)}%`;
                    }
                });
            }

                        // ── Tab visibility: abort streams when hidden, reload on show ─
            document.addEventListener('visibilitychange', () => {
                if (document.hidden) {
                    stopLogFollow();
                    stopChatStream();
                } else {
                    // Reload log data for currently selected model
                    if (logModel) loadLogSnapshot(logModel);
                }
            });

            // ── 3. Resize handles (vertical + horizontal) ───────────────
            const rootStyle = document.documentElement.style;
            const VKEY = 'arkestra-col-width';
            const HKEY = 'arkestra-log-ratio';

            // Restore saved ratios
            const sv = localStorage.getItem(VKEY);
            if (sv && !isNaN(sv)) rootStyle.setProperty('--col-width', sv + '%');
            const sh = localStorage.getItem(HKEY);
            if (sh && !isNaN(sh)) {
                const logsP = document.getElementById('pane-logs');
                const chatP = document.getElementById('pane-chat');
                if (logsP && chatP) {
                    logsP.style.flex = '0 0 ' + sh + '%';
                    chatP.style.flex = '0 0 ' + (100 - sh) + '%';
                }
            }

            // Vertical divider: left ↔ right
            const vDivider = document.getElementById('col-divider');
            vDivider?.addEventListener('mousedown', e => {
                isVDragging = true;
                vDivider.classList.add('active');
                document.body.style.cursor = 'col-resize';
                document.body.style.userSelect = 'none';
                e.preventDefault();
            });

            // Horizontal divider: logs ↔ chat
            const hDivider = document.getElementById('row-divider');
            hDivider?.addEventListener('mousedown', e => {
                isHDragging = true;
                hDivider.classList.add('active');
                document.body.style.cursor = 'row-resize';
                document.body.style.userSelect = 'none';
                e.preventDefault();
            });

            window.addEventListener('mousemove', e => {
                const layout = document.querySelector('.layout');
                if (!layout) return;
                const rect = layout.getBoundingClientRect();

                if (isVDragging) {
                    const pct = Math.round(((e.clientX - rect.left) / rect.width) * 100);
                    if (pct >= 20 && pct <= 80) {
                        rootStyle.setProperty('--col-width', pct + '%');
                        localStorage.setItem(VKEY, String(pct));
                    }
                } else if (isHDragging) {
                    const rightCol = document.getElementById('right-panel');
                    if (!rightCol) return;
                    const rRect = rightCol.getBoundingClientRect();
                    const ratio = Math.round(((e.clientY - rRect.top) / rRect.height) * 100);
                    if (ratio >= 15 && ratio <= 85) {
                        const logsP = document.getElementById('pane-logs');
                        const chatP = document.getElementById('pane-chat');
                        if (logsP && chatP) {
                            logsP.style.flex = '0 0 ' + ratio + '%';
                            chatP.style.flex = '0 0 ' + (100 - ratio) + '%';
                        }
                        localStorage.setItem(HKEY, String(ratio));
                    }
                }
            });

            window.addEventListener('mouseup', () => {
                if (isVDragging) {
                    isVDragging = false;
                    vDivider?.classList.remove('active');
                    document.body.style.cursor = '';
                    document.body.style.userSelect = '';
                } else if (isHDragging) {
                    isHDragging = false;
                    hDivider?.classList.remove('active');
                    document.body.style.cursor = '';
                    document.body.style.userSelect = '';
                }
            });

        // ── 5. Logs pane — stream + snapshot ──────────────────────
            // (old log-follow wiring removed — new handler in DOMContentLoaded above)

            // ── 6. Chat pane wireups ────────────────────────────────
            document.getElementById('right-chat-params-toggle')?.addEventListener('click', toggleChatParams);
            document.getElementById('right-chat-form')?.addEventListener('submit', sendMessage);

            // Auto-persist params on any change
            ['rcp-temp', 'rcp-top-p', 'rcp-max-tokens'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.addEventListener('change', saveChatParams);
            });
        });
    </script>

    <!-- Markdown rendering (loaded lazily by JS) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" defer></script>
</head>
<body>

    <!-- ── Header ──────────────────────────────────────────────── -->
    <header class="header-bar">
        <div class="title">
            ArkestraAdmin
            <span class="model-count" id="model-count"></span>
            <button id="btn-collapse-all" title="Collapse all expanded items" style="font-size:11px;padding:3px 8px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface-alt);color:var(--text);cursor:pointer;">▼ Collapse All</button>
        </div>
    </header>

    <!-- ── Main Layout ─────────────────────────────────────────── -->
    <div class="layout">

        <!-- ── Left Column — single accordion widget ─────────────── -->
        <aside class="left-panel" id="left-panel">
            <section class="accordion" id="left-accordion">
                <!-- Settings placeholder (disabled, collapsed) -->
                <section class="accordion-item collapsed" id="sec-settings">
                    <h3>⚙ Settings</h3>
                    <div class="acc-body"><p class="placeholder-text">Server configuration — coming soon.</p></div>
                </section>
                <!-- Model items: dynamically generated at runtime -->
                <div id="model-accordion-items"></div>
            </section>
        </aside>

        <!-- Vertical divider (for resize) -->
        <div class="divider-v" id="col-divider"></div>

        <!-- ── Right Column — two independent panes ──────────────── -->
        <main class="right-panel" id="right-panel">
            <!-- Logs Pane -->
            <div class="pane pane-logs" id="pane-logs">
                <div class="pane-header">
                    <label>Select Model:</label>
                    <select id="log-model-select"></select>
                    <label><input type="checkbox" id="log-follow-cb"> Follow</label>
                </div>
                <pre class="log-container" id="log-display"></pre>
            </div>

            <!-- Horizontal divider (for resize) -->
            <div class="divider-h" id="row-divider"></div>

            <!-- Chat Pane -->
            <div class="pane pane-chat" id="pane-chat">
                <div class="pane-header">
                    <label>Select Model:</label>
                    <select id="chat-model-select"></select>
                    <span class="chat-params-toggle" id="right-chat-params-toggle">⚙ Parameters ▾</span>
                </div>
                <div class="chat-messages" id="chat-display"></div>

                <div class="chat-params-panel" id="chat-params-panel">
                    <div class="chat-params-grid">
                        <div class="chat-param">
                            <label for="rcp-temp">Temperature</label>
                            <input type="number" id="rcp-temp" min="0" max="2" step="0.05" value="0.7">
                        </div>
                        <div class="chat-param">
                            <label for="rcp-top-p">Top P</label>
                            <input type="number" id="rcp-top-p" min="0" max="1" step="0.05" value="0.95">
                        </div>
                        <div class="chat-param">
                            <label for="rcp-max-tokens">Max Tokens</label>
                            <input type="number" id="rcp-max-tokens" min="1" max="8192" step="64" value="512">
                        </div>
                    </div>
                </div>

                <form class="chat-form" id="right-chat-form">
                    <textarea id="right-chat-input" placeholder="Type a message…"></textarea>
                    <button type="submit" class="chat-send-btn" id="right-chat-send-btn">▶</button>
                </form>
            </div>
        </main>

    </div>

</body>
</html>
