# ═══════════════════════════════════════════════════════════
# sources.yaml — Binary & image download sources
# ═══════════════════════════════════════════════════════════
#
# Define named sources that backends can reference via `binary_source` or
# `image_source` in config.yaml. Each source specifies where to obtain the
# llama.cpp binary (process runner) or container image (container runner).
#
# Sources are loaded by ConfigManager from this file at startup. A backend's
# `binary_source` key must match a source name defined here; if no match is
# found, the backend falls back to building from its Containerfile.
#
# Example backend config:
#   backends:
#     rocm:
#       engine: llama_cpp
#       runner: process
#       binary_source: lemonade-nightly    # references a source below
#       binary_version: latest             # "latest" or a pinned version/tag
#
# ── Available source types ─────────────────────────────────────────────────

sources:

  # ── GitHub Releases (tarball with embedded binary) ────────────────────────
  # Downloads a release asset tarball, verifies its SHA256 checksum, extracts
  # the binary into the local cache directory. Supports arch-specific variants
  # via `arch_map` that maps the current platform's architecture to an asset
  # filename variant suffix (e.g., "-aarch64").

  lemonade-nightly:
    type: github-release
    repo: lemonade-sdk/llamacpp-rocm       # owner/repo on GitHub
    release_type: latest                    # "latest" = newest tag via API
    asset_pattern: "*-linux-x86_64.tar.gz" # glob to match desired asset
    sha256_asset: "*.sha256"               # pattern for checksum sidecar file
    arch_map:                               # platform.arch → filename suffix
      x86_64: ""                            # empty = default name, no suffix
      aarch64: "-aarch64"                   # append this to asset name before glob

  official-release:
    type: github-release
    repo: ggml-org/llama.cpp
    release_type: latest                    # newest tag from GitHub API
    asset_pattern: "llama-server-*-bin-*"  # base binary pattern
    sha256_asset: "*.sha256"

  official-vulkan-radv:
    type: github-release
    repo: ggml-org/llama.cpp
    release_type: latest
    asset_pattern: "llama-server-*-bin-*-vulkan*"   # Vulkan with RADV driver
    sha256_asset: "*.sha256"

  official-cuda:
    type: github-release
    repo: ggml-org/llama.cpp
    release_type: latest
    asset_pattern: "llama-server-*-bin-*-cuda*"     # NVIDIA CUDA build
    sha256_asset: "*.sha256"


  # ── OCI Container Images (pulled via Docker/Podman) ───────────────────────
  # Instead of downloading a binary tarball, this source provides a pre-built
  # container image. The ImagePuller fetches the image and makes it available
  # to the container runner. Uses standard registry auth if configured.

  official-cuda-image:
    type: oci-image
    registry: ghcr.io                           # default Docker Hub is "docker.io"
    repo: ggml-org/llama.cpp/server-cuda        # full image path on the registry
    tag: latest                                 # pinned tag or "latest"

  official-vulkan-image:
    type: oci-image
    registry: ghcr.io
    repo: ggml-org/llama.cpp/server-vulkan
    tag: latest

  strix-halo-toolbox:
    type: oci-image
    registry: ghcr.io
    repo: kyuz0/amd-strix-halo-toolboxes
    tag_pattern: latest-strxhalo-{arch}          # {arch} substituted at runtime (e.g. x86_64)


  # ── Local File (user-supplied binary) ─────────────────────────────────────
  # For air-gapped machines or custom-built binaries. The user places a single
  # binary file here; ModelArkestra verifies it exists and is executable.

  local-custom:
    type: local-file
    path: ~/.local/share/model-arkestra/bin/llama-server
    sha256: ""                                   # empty = skip verification; set to known hash for integrity


# ── Global defaults (applied to sources that don't override them) ───────────

defaults:
  release_type: latest               # "latest" or a pinned version/tag string
  verify_checksum: true              # abort download if SHA256 doesn't match
  cache_ttl_hours: 24                # for "latest" sources: skip re-check if cached
                                     #   within this many hours
