backends:
  vulkan-radv:
    description: "Vulkan (RADV) — AMD GPU; also the generic Vulkan build for other GPUs/CPU"
    source:
      type: remote
      repo: ggml-org/llama.cpp
      asset: llama-{tag}-bin-ubuntu-vulkan-x64.tar.gz
    runner: process
    engine: llama-cpp
    args:
      ngl: 999
      ctx-size: ${default/ctx-size}
      flash-attn: 'on'
      parallel: 1
      load-mode: none
      cache-type-k: q8_0
      cache-type-v: q8_0
  # One backend per gfx target — the ID names the hardware it was built for.
  rocm-gfx1151:
    description: "ROCm gfx1151 — Strix Halo (Ryzen AI Max+)"
    source:
      type: remote
      repo: lemonade-sdk/llamacpp-rocm
      asset: llama-{tag}-ubuntu-rocm-gfx1151-x64.zip
    runner: process
    engine: llama-cpp
    args:
      ngl: 999
      ctx-size: ${default/ctx-size}
      flash-attn: 'on'
      parallel: 1
      load-mode: none
      cache-type-k: q8_0
      cache-type-v: q8_0
  rocm-gfx120x:
    description: "ROCm gfx120x — Radeon RX 9000 series"
    source:
      type: remote
      repo: lemonade-sdk/llamacpp-rocm
      asset: llama-{tag}-ubuntu-rocm-gfx120X-x64.zip
    runner: process
    engine: llama-cpp
    args:
      ngl: 999
      ctx-size: ${default/ctx-size}
      flash-attn: 'on'
      parallel: 1
      load-mode: none
      cache-type-k: q8_0
      cache-type-v: q8_0
  rocm-gfx1150:
    description: "ROCm gfx1150"
    source:
      type: remote
      repo: lemonade-sdk/llamacpp-rocm
      asset: llama-{tag}-ubuntu-rocm-gfx1150-x64.zip
    runner: process
    engine: llama-cpp
    args:
      ngl: 999
      ctx-size: ${default/ctx-size}
      flash-attn: 'on'
      parallel: 1
      load-mode: none
      cache-type-k: q8_0
      cache-type-v: q8_0
  rocm-gfx110x:
    description: "ROCm gfx110x"
    source:
      type: remote
      repo: lemonade-sdk/llamacpp-rocm
      asset: llama-{tag}-ubuntu-rocm-gfx110X-x64.zip
    runner: process
    engine: llama-cpp
    args:
      ngl: 999
      ctx-size: ${default/ctx-size}
      flash-attn: 'on'
      parallel: 1
      load-mode: none
      cache-type-k: q8_0
      cache-type-v: q8_0
  rocm-gfx90a:
    description: "ROCm gfx90a — MI300 / RDNA3"
    source:
      type: remote
      repo: lemonade-sdk/llamacpp-rocm
      asset: llama-{tag}-ubuntu-rocm-gfx90a-x64.zip
    runner: process
    engine: llama-cpp
    args:
      ngl: 999
      ctx-size: ${default/ctx-size}
      flash-attn: 'on'
      parallel: 1
      load-mode: none
      cache-type-k: q8_0
      cache-type-v: q8_0
  rocm-gfx103x:
    description: "ROCm gfx103x"
    source:
      type: remote
      repo: lemonade-sdk/llamacpp-rocm
      asset: llama-{tag}-ubuntu-rocm-gfx103X-x64.zip
    runner: process
    engine: llama-cpp
    args:
      ngl: 999
      ctx-size: ${default/ctx-size}
      flash-attn: 'on'
      parallel: 1
      load-mode: none
      cache-type-k: q8_0
      cache-type-v: q8_0
  rocm-container:
    description: "ROCm in a container — crash isolation for the GPU build"
    runner: podman
    image: docker.io/rocm/dev-ubuntu-26.04:7.14.1-full
    entrypoint: /llm-server/bin/llama-server
    binary_dir: /path/to/your/rocm-bin   # mounted at /llm-server/bin (ro)
    env_container:
      LD_LIBRARY_PATH: /llm-server/bin:/opt/rocm/lib
    devices:
    - /dev/kfd
    - /dev/dri
    engine: llama-cpp
    args:
      ngl: 999
      ctx-size: ${default/ctx-size}
      flash-attn: 'on'
      parallel: 1
      load-mode: none
      cache-type-k: q8_0
      cache-type-v: q8_0
  cuda:
    description: "NVIDIA CUDA — for NVIDIA discrete GPUs"
    source:
      type: remote
      repo: ggml-org/llama.cpp
      asset: llama-{tag}-bin-ubuntu-cuda-13.3-x64.tar.gz
    runner: process
    engine: llama-cpp
    args:
      ngl: 999
      ctx-size: ${default/ctx-size}
      flash-attn: 'on'
      parallel: 1
      load-mode: none
      cache-type-k: q8_0
      cache-type-v: q8_0
  cpu:
    description: "CPU-only mode — uses all available cores"
    source:
      type: remote
      repo: ggml-org/llama.cpp
      asset: llama-{tag}-bin-ubuntu-x64.tar.gz
    runner: process
    engine: llama-cpp
    args:
      threads: ${NPROC}
      ctx-size: ${default/ctx-size}
      load-mode: none
  onnx:
    description: "ONNX in-memory runner — loads models directly, no subprocess"
    runner: onnx
    engine: onnx
  # ── stable-diffusion.cpp (text-to-image) ─────────────────────────────────
  # Separate engine: sd-server binary, GGUF diffusion weights, OpenAI images API.
  # {sha} renders as the tag's last dash-segment (master-920-2f88688 → 2f88688).
  # No gfx-specific sd builds exist — ROCm kernels JIT per gfx at runtime, so one
  # ROCm asset covers gfx1151 and friends. ROCm version pinned to the system one.
  sd-rocm:
    description: "stable-diffusion.cpp sd-server — ROCm (gfx1151 / Strix Halo)"
    source:
      type: remote
      repo: lemonade-sdk/stable-diffusion.cpp
      asset: sd-master-{sha}-bin-Linux-Ubuntu-24.04-x86_64-rocm-7.14.0.zip
      binary: sd-server
    runner: process
    engine: sdcpp
    health_path: /
  sd-vulkan:
    description: "stable-diffusion.cpp sd-server — Vulkan fallback"
    source:
      type: remote
      repo: lemonade-sdk/stable-diffusion.cpp
      asset: sd-master-{sha}-bin-Linux-Ubuntu-24.04-x86_64-vulkan.zip
      binary: sd-server
    runner: process
    engine: sdcpp
    health_path: /
